[package]
name = "tattler"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Consistent hashing, routing, and cluster membership for distributed Rust systems."
keywords = ["consistent-hashing", "hashring", "distributed-systems", "sharding", "membership"]
categories = ["data-structures", "algorithms", "network-programming", "distributed-systems"]
license = "Apache-2.0"
repository = "https://github.com/vllst-io/tattler-rs"
documentation = "https://docs.rs/tattler"

[features]
default = ["ring"]
ring = ["dep:bytes", "dep:twox-hash"]
memberlist = []
router = ["ring"]

[dependencies]
bytes = { version = "1.12.1", optional = true }
twox-hash = { version = "2.1.4", optional = true }

[[example]]
name = "cache"
required-features = ["ring"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1