name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"

env:
  # Fail the build on any rustc warning, in every job below.
  RUSTFLAGS: -Dwarnings

jobs:
  test-and-check:
    name: test / ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable + the pinned MSRV from Cargo.toml `rust-version`.
        toolchain: [stable, "1.97"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack,cargo-audit
      - run: make verify


  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features


